# Netlify — serves frontend/ (Next.js static export). API lives on HuggingFace Spaces.
[build]
  base = "frontend/"
  command = "npm run build"
  publish = "out/"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "true"

# Cache Next.js static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

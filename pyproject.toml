[tool.poetry]
name = "dataforge-ai"
version = "2.0.0"
description = "Autonomous business intelligence engine: 13 LangGraph agents turn a dataset into KPIs, insights and an executive report"
authors = ["DataForge AI Contributors"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/AjmalDanish/dataforge-ai"
keywords = ["business-intelligence", "ai", "agents", "langgraph", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{ include = "dataforge" }]

[tool.poetry.dependencies]
python = "^3.11"
pandas = ">=2.1"
numpy = ">=1.26"
scipy = ">=1.11"
pyarrow = ">=14"
openpyxl = ">=3.1"
chardet = ">=5.0"
plotly = ">=5.18"
jinja2 = ">=3.1"
reportlab = ">=4.0"
langgraph = ">=1.0"
pydantic = ">=2.5"
click = ">=8.1"
python-dotenv = ">=1.0"
anthropic = ">=1.0"
openai = ">=1.0"
# Optional: web API and the (not yet wired) SQL persistence models
fastapi = { version = ">=0.110", optional = true }
uvicorn = { version = ">=0.29", extras = ["standard"], optional = true }
python-multipart = { version = ">=0.0.9", optional = true }
sqlalchemy = { version = ">=2.0", optional = true }

[tool.poetry.extras]
api = ["fastapi", "uvicorn", "python-multipart"]
db = ["sqlalchemy"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=4.1"
pytest-mock = ">=3.12"
httpx = ">=0.27"
ruff = ">=0.6"

[tool.poetry.scripts]
dataforge = "dataforge.presentation.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=dataforge",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["dataforge"]
omit = [
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]